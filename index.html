<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Pomodoro Timer</title>
    <link rel="stylesheet" href="styles.css"/>
</head>

<body>

    <div class="container">
        <h1>Pomodoro Timer</h1>

        <!-- Mode selector tabs -->
        <div class="mode-tabs">
            <button class="tab active" data-mode="work">Work</button>
            <button class="tab" data-mode="short-break">Short Break</button>
            <button class="tab" data-mode="long-break">Long Break</button>
        </div>

        <!-- Timer display -->
        <div class="timer-display">
            <span id="minutes">30</span>:<span id="seconds">00</span>
        </div>

        <!-- Controls -->
        <div class="controls">
            <button id="start-stop-btn">Start</button>
            <button id="reset-btn">Reset</button>
        </div>

        <!-- Session counter -->
        <p class="session-count">Sessions completed: <span id="session-count">0</span></p>
    </div>

    <script src="script.js"></script>
</body>

</html>
